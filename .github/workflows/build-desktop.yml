name: Build Windows app

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  bundle-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install NSIS for the EXE installer
        run: choco install nsis -y --no-progress
      - run: npm run tauri:build:windows
      - uses: actions/upload-artifact@v4
        with:
          name: atlas-al-huruf-windows
          path: |
            src-tauri/target/**/bundle/msi/**
            src-tauri/target/**/bundle/nsis/**
      - name: Publish Windows installers to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            src-tauri/target/**/bundle/msi/*.msi
            src-tauri/target/**/bundle/nsis/*.exe
